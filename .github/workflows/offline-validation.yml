name: Prepare offline validation
on:
  pull_request:
    paths: [.github/workflows/offline-validation.yml]
permissions:
  contents: read
jobs:
  kit:
    if: github.head_ref == 'feat/source-causality'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore DiagnosticsVisualizer.slnx
      - name: Retain SDK and public package dependencies for isolated validation
        shell: bash
        run: |
          set -euo pipefail
          export KIT="$RUNNER_TEMP/validation-kit"
          export SDK_VERSION="$(dotnet --version)"
          python3 - <<'PY'
          import os, pathlib, shutil
          root = pathlib.Path(os.environ['DOTNET_ROOT'])
          kit = pathlib.Path(os.environ['KIT'])
          dest = kit / 'dotnet'
          dest.mkdir(parents=True)
          shutil.copy2(root / 'dotnet', dest / 'dotnet')
          for path in ['host', 'sdk/' + os.environ['SDK_VERSION'], 'sdk-manifests', 'metadata']:
              if (root / path).exists(): shutil.copytree(root / path, dest / path)
          for group in ['shared/Microsoft.NETCore.App', 'shared/Microsoft.AspNetCore.App', 'packs/Microsoft.NETCore.App.Ref', 'packs/Microsoft.AspNetCore.App.Ref', 'packs/Microsoft.NETCore.App.Host.linux-x64']:
              for major in ['8.', '10.']:
                  candidates = sorted((p for p in (root / group).glob('*') if p.name.startswith(major)), key=lambda p: tuple(map(int, p.name.split('.'))))
                  if candidates:
                      path = candidates[-1]
                      shutil.copytree(path, dest / group / path.name)
          shutil.copytree(pathlib.Path.home() / '.nuget/packages', kit / 'packages')
          PY
          tar -czf "$RUNNER_TEMP/validation-kit.tar.gz" -C "$KIT" .
          split -b 250M "$RUNNER_TEMP/validation-kit.tar.gz" "$RUNNER_TEMP/validation-kit.part-"
      - uses: actions/upload-artifact@v4
        with:
          name: offline-kit-aa
          path: ${{ runner.temp }}/validation-kit.part-aa
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: offline-kit-ab
          path: ${{ runner.temp }}/validation-kit.part-ab
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: offline-kit-ac
          path: ${{ runner.temp }}/validation-kit.part-ac
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: offline-kit-ad
          path: ${{ runner.temp }}/validation-kit.part-ad
          retention-days: 1
          compression-level: 0
