name: Offline validation toolchain
on:
  push:
    branches: [feat/rider-workbench]
    paths: [.github/workflows/offline-validation.yml]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore updated Avalonia 11 Dock packages
        run: |
          mkdir -p /tmp/validation-dependencies artifacts/feed
          printf '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup><ItemGroup><PackageReference Include="Dock.Avalonia.v11" Version="11.3.22" /><PackageReference Include="Dock.Avalonia.Themes.Fluent.v11" Version="11.3.22" /><PackageReference Include="Dock.Model.Mvvm" Version="12.1.0.7" /></ItemGroup></Project>' > /tmp/validation-dependencies/validation.csproj
          dotnet restore /tmp/validation-dependencies/validation.csproj
          find "$HOME/.nuget/packages" -name '*.nupkg' -exec cp {} artifacts/feed/ \;
          tar -czf artifacts/dock-feed.tar.gz -C artifacts feed
      - uses: actions/upload-artifact@v4
        with:
          name: dock-validation-feed
          path: artifacts/dock-feed.tar.gz
          compression-level: 0
          retention-days: 1
