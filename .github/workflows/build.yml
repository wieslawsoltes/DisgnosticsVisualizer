name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact source revision
        run: |
          mkdir -p artifacts/source
          git archive --format=tar.gz HEAD > artifacts/source/source.tar.gz
          git rev-parse HEAD > artifacts/source/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: artifacts/source
          retention-days: 7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build DiagnosticsVisualizer.slnx -c Release
      - run: dotnet test tests/DiagnosticsVisualizer.Tests -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - run: dotnet test tests/DiagnosticsVisualizer.UiTests -c Release --no-build --logger "trx;LogFileName=ui-tests.trx"
      - name: Validate ingestion benchmark contents and record measurements
        run: dotnet run --project tests/DiagnosticsVisualizer.Benchmarks -c Release --no-build -- artifacts/performance/ingestion-report.json
      - name: Pack and validate every reusable library
        run: bash eng/pack.sh
      - name: Execute instrumented Avalonia locally and through the collector
        run: bash eng/integration.sh
      - name: Install software EGL validation dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1-mesa-dev libgl1-mesa-dri
      - name: Execute packaged Skia GPU timestamp and GL-state checks
        run: bash eng/gpu-integration.sh
      - name: Summarize executed tests and matched adapter counts
        if: always()
        run: |
          python3 - <<'PY'
          import collections, json, pathlib, xml.etree.ElementTree as ET
          summary = {'tests': {}, 'adapters': {}}
          for path in pathlib.Path('tests').glob('*/TestResults/*.trx'):
              counters = ET.parse(path).find('.//{*}Counters')
              if counters is not None: summary['tests'][str(path)] = counters.attrib
          manifest = pathlib.Path('artifacts/integration/weaving-report.json')
          if manifest.exists():
              data = json.loads(manifest.read_text())
              summary['adapters'] = dict(collections.Counter(m['Status'] for a in data['Assemblies'] for m in a['Methods']))
          pathlib.Path('artifacts').mkdir(exist_ok=True)
          pathlib.Path('artifacts/validation-summary.json').write_text(json.dumps(summary, indent=2))
          print('DIAGNOSTICS_VALIDATION_SUMMARY ' + json.dumps(summary))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-and-packages
          path: |
            **/TestResults/*.trx
            **/TestResults/*.png
            artifacts/packages/*
            artifacts/integration/*report.json
            artifacts/integration/*.log
            artifacts/performance/*.json
            artifacts/validation-summary.json
            artifacts/gpu/*report.json
            artifacts/gpu/*.log
      - name: Retain actual software GL timestamp recording
        uses: actions/upload-artifact@v4
        with:
          name: recorded-gpu-example
          path: artifacts/gpu/capture.avtrace
          retention-days: 14
      - name: Retain actual instrumented sample recording
        uses: actions/upload-artifact@v4
        with:
          name: recorded-binding-example
          path: artifacts/integration/sample.avtrace
          retention-days: 14
