name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact source revision
        run: |
          mkdir -p artifacts/source
          git archive --format=tar.gz HEAD > artifacts/source/source.tar.gz
          git rev-parse HEAD > artifacts/source/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: artifacts/source
          retention-days: 7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build DiagnosticsVisualizer.slnx -c Release
      - run: dotnet test tests/DiagnosticsVisualizer.Tests -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - run: dotnet pack src/DiagnosticsVisualizer.Runtime -c Release --no-build -o artifacts/packages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-and-packages
          path: |
            **/TestResults/*.trx
            artifacts/packages/*
